  - type: Features
    data:
      - name: Printed Circuit Board Manufacturing
        description: >-
          Conventional, HDI, flex and rigid-flex, RF/microwave, and
          substrate-like PCBs, plus thermal-management interconnect for
          high-reliability and high-density applications.
      - name: RF and Microwave Components
        description: >-
          Xinger surface-mount RF components, circulators, beamforming
          networks, transceivers, integrated RF/microwave assemblies, and
          resistive components for radar, communications, and electronic
          warfare systems.
      - name: Microelectronics and Custom Assemblies
        description: >-
          Custom and standard multi-chip modules (MCMs), mixed-signal ASICs,
          and ceramic substrates engineered for aerospace, defense, and
          industrial environments.
      - name: Mission Systems
        description: >-
          Radar, communications, and surveillance systems delivered through
          TTM's Telephonics-derived defense business serving prime contractors
          and government end customers.
      - name: System Integration
        description: >-
          Backplane assembly, MicroTCA platforms, and custom specialty
          electronic products integrating PCB, RF, and microelectronic
          building blocks into complete subsystems.
  - type: UseCases
    data:
      - name: Aerospace and Defense Electronics
        description: >-
          Radar arrays, electronic warfare subsystems, secure communications,
          and ruggedized mission electronics for prime defense contractors and
          allied government programs. A&D represents roughly 44% of TTM
          revenue.
      - name: Data Center Computing Infrastructure
        description: >-
          High-layer-count and HDI PCBs for AI accelerator boards, switches,
          and server platforms supporting hyperscale data center build-outs
          (~24% of revenue).
      - name: Medical, Industrial, and Instrumentation
        description: >-
          PCBs and assemblies for diagnostic imaging, surgical robotics,
          industrial automation, and test and measurement instrumentation
          (~14% of revenue).
      - name: Automotive Electronics
        description: >-
          PCBs for ADAS, infotainment, EV powertrain, and connectivity
          modules supplying tier-one automotive manufacturers (~10% of
          revenue).
      - name: Networking and Communications
        description: >-
          PCBs and RF assemblies for wireless infrastructure, 5G base
          stations, optical networking, and broadband equipment (~8% of
          revenue).
