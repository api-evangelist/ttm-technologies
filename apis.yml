description: >-
  TTM Technologies, Inc. (NASDAQ: TTMI) is a leading global manufacturer of
  technology products, including mission systems, radio frequency components,
  RF microwave and microelectronic assemblies, and technologically advanced
  printed circuit boards (PCBs). TTM serves aerospace and defense, data center
  computing, medical, industrial and instrumentation, automotive, and
  networking and communications markets. The company reported approximately
  $2.9B in FY2025 revenue, operates 24 specialized facilities across North
  America and Asia Pacific, and employs more than 18,000 people. TTM expanded
  its defense electronics footprint with the 2022 acquisition of Telephonics
  from Griffon Corporation.
